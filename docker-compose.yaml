services:
  mysql:
    image: mysql:8.4
    container_name: mysql8

    ports:
      - "3306:3306"

    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: iam

    volumes:
      - mysql-data:/var/lib/mysql

    restart: unless-stopped

  redis:
    image: redis:7.4
    container_name: redis7

    ports:
      - "6379:6379"

    command: redis-server --appendonly yes

    volumes:
      - redis-data:/data

    restart: unless-stopped

volumes:
  mysql-data:
  redis-data: