<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>flow-admin · SSO Demo</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; line-height: 1.5; }
    h1 { font-size: 1.5rem; }
    button { padding: 10px 20px; font-size: 1rem; cursor: pointer; }
    .muted { color: #666; font-size: 0.9rem; }
    code { background: #f4f4f4; padding: 2px 6px; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>flow-admin</h1>
  <p class="muted">标准 OIDC Authorization Code + PKCE · 纯 HTML/JS 最小演示</p>
  <p>测试账号：<code>admin@qq.com</code> / <code>123456</code></p>
  <button id="btn-login" type="button">SSO 登录 IAM</button>
  <p id="status" class="muted"></p>

  <script src="config.js"></script>
  <script src="oidc.js"></script>
  <script>
    const cfg = window.FLOW_ADMIN_CONFIG;
    const tokens = FlowAdminOidc.getTokens();
    if (tokens?.access_token) {
      window.location.replace('app.html');
    }

    document.getElementById('btn-login').addEventListener('click', () => {
      document.getElementById('status').textContent = '跳转 IAM 授权页…';
      FlowAdminOidc.startLogin(cfg);
    });
  </script>
</body>
</html>
