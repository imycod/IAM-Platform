# IAM Platform 本地上线模拟（子域 + 反代宿主机 dev 服务）
# login.iam.local → :5180  iam-login（勿用 4180：Windows 常保留 4126–4225）
# api.iam.local   → :3000  IAM API + /oidc
# admin.iam.local → :8848  iam-admin (Vite)
# flow.iam.local  → :8849  flow-admin (Vite)

server {
    listen 80;
    server_name login.iam.local;

    location / {
        proxy_pass http://host.docker.internal:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name api.iam.local;

    location / {
        proxy_pass http://host.docker.internal:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_buffering off;
    }
}

server {
    listen 80;
    server_name admin.iam.local;

    location / {
        proxy_pass http://host.docker.internal:8848;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name flow.iam.local;

    location / {
        proxy_pass http://host.docker.internal:8849;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
