# IAM Platform local nginx (subdomain reverse proxy to host ports)
#
# Topology:
#   auth.pinshuai.local  -> IdP (login UI + /oidc + /api/interaction)
#   api.pinshuai.local   -> IAM business API
#   admin.pinshuai.local -> iam-admin (Vite :8088)
#   flow.pinshuai.local  -> flow-admin (Vite :8089)
#
# Login UI and OIDC must share the auth origin for cookies.

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# ---- IdP: login UI + OIDC + interaction API (same origin) ----
server {
    listen 80;
    server_name auth.pinshuai.local;

    location /oidc {
        proxy_pass http://host.docker.internal:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_buffering off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    location /api {
        proxy_pass http://host.docker.internal:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_buffering off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://host.docker.internal:4180;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}

# ---- Business API (OIDC only on auth) ----
server {
    listen 80;
    server_name api.pinshuai.local;

    location /oidc {
        return 302 http://auth.pinshuai.local$request_uri;
    }

    location / {
        proxy_pass http://host.docker.internal:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_buffering off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}

# Compat: login.* -> auth.*
server {
    listen 80;
    server_name login.pinshuai.local;

    location / {
        return 302 http://auth.pinshuai.local$request_uri;
    }
}

server {
    listen 80;
    server_name admin.pinshuai.local;

    location / {
        proxy_pass http://host.docker.internal:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}

server {
    listen 80;
    server_name flow.pinshuai.local;

    location / {
        proxy_pass http://host.docker.internal:8089;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
