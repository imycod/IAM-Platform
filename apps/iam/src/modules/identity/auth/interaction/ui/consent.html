<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Authorize - IAM</title>
  <link href="./assets/css/Inter-css2.css" rel="stylesheet">
  <link href="./assets/css/consent.css" rel="stylesheet">
</head>

<body>
  <div class="consent-page">
    <div class="consent-card">
      <div class="consent-logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 2L15 9H9L12 2Z" />
          <path d="M12 22L9 15H15L12 22Z" />
          <path d="M2 12L9 9V15L2 12Z" />
          <path d="M22 12L15 15V9L22 12Z" />
        </svg>
        <span>IAM Platform</span>
      </div>

      <h1>Authorize Application</h1>
      <p class="consent-subtitle">Review the permissions requested by this application.</p>

      <div class="consent-app">
        <span class="consent-app-label">Application</span>
        <strong id="consent-client-id">—</strong>
      </div>

      <div class="consent-scopes-box">
        <span class="consent-app-label">Requested scopes</span>
        <div id="consent-scopes" class="consent-scopes">—</div>
      </div>

      <div class="consent-error" id="consent-error" style="display:none;"></div>

      <a id="consent-return-btn" class="consent-return-btn" style="display:none;" href="#">Return to application</a>

      <form id="consent-form" method="POST" class="consent-actions">
        <input type="hidden" name="action" id="consent-action" value="approve" />
        <input type="hidden" name="client_id" id="consent-client-id-input" value="" />
        <button type="submit" class="btn-deny" data-action="deny">Deny</button>
        <button type="submit" class="btn-approve" data-action="approve">Allow</button>
      </form>
    </div>
  </div>

  <script src="./assets/consent.js"></script>
</body>

</html>
