# IAM Platform 本地上线模拟（子域 + 反代宿主机 dev 服务）
# auth.pinshuai.local  → :3000  授权服务器（/oidc + /api/interaction + 登录/consent UI）
# api.pinshuai.local   → :3000  IAM 业务 API
# admin.pinshuai.local → :8848  iam-admin (Vite)
# flow.pinshuai.local  → :8849  flow-admin (Vite)
#
# Windows Docker Desktop 下 host.docker.internal 同时有 IPv6（常不可达）与 IPv4。
# proxy_pass 写死 hostname 时 nginx 可能在启动期绑定 IPv6 → 间歇 502。
# 用 Docker 内置 DNS + ipv6=off + 变量 proxy_pass，强制走 IPv4（如 192.168.65.254）。

resolver 127.0.0.11 ipv6=off valid=30s;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name auth.pinshuai.local;

    # 授权服务器与登录/consent UI 同源：/oidc、/api、/interaction-assets 全部由 IAM 后端提供。
    location / {
        set $dev_host host.docker.internal;
        proxy_pass http://$dev_host:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_buffering off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}

# 旧的独立登录域已废弃，兜底重定向到授权服务器根，避免书签 404。
server {
    listen 80;
    server_name login.pinshuai.local;
    location / {
        return 301 http://auth.pinshuai.local$request_uri;
    }
}

server {
    listen 80;
    server_name api.pinshuai.local;

    location / {
        set $dev_host host.docker.internal;
        proxy_pass http://$dev_host:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_buffering off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}

server {
    listen 80;
    server_name admin.pinshuai.local;

    location / {
        set $dev_host host.docker.internal;
        proxy_pass http://$dev_host:8848;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}

server {
    listen 80;
    server_name flow.pinshuai.local;

    location / {
        set $dev_host host.docker.internal;
        proxy_pass http://$dev_host:8849;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
